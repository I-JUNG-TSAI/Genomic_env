name: genomics_full
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  
  # --- 資料下載與轉換 (New!) ---
  - sra-tools           # 包含 prefetch, fasterq-dump
  - parallel-fastq-dump # 用多執行緒加速 fastq 轉換，比原生的快非常多
  
  # --- 序列品質控管 ---
  - fastp
  - multiqc
  
  # --- 比對與格式轉換 ---
  - bwa-mem2
  - samtools
  - bcftools
  - bedtools
